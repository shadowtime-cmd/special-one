
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Gunnu ♡</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #09070d;
    color: white;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
}

/* BACKGROUND GLOW */
.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: .2;
    pointer-events: none;
}

.glow.one {
    background: #d64e91;
    top: -150px;
    left: -100px;
}

.glow.two {
    background: #7743a5;
    bottom: -150px;
    right: -100px;
}

/* MAIN CARD */
.container {
    width: 100%;
    max-width: 540px;
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 48px 30px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 26px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 100px rgba(0,0,0,.5);
}

/* PAGE TRANSITIONS */
.page {
    display: none;
    animation: appear .8s ease forwards;
}

.page.active {
    display: block;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TYPOGRAPHY */
.tag {
    color: #d58eae;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 35px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 9vw, 52px);
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 18px;
}

h1 span {
    color: #e9a0bd;
    font-style: italic;
}

.subtitle {
    color: #aaa1ad;
    font-size: 13px;
    line-height: 1.9;
    letter-spacing: .5px;
    margin-bottom: 35px;
}

.heart {
    font-size: 43px;
    display: inline-block;
    animation: heartbeat 1.8s infinite;
    filter: drop-shadow(0 0 15px #ff4f91);
    margin-bottom: 23px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
}

/* CONFESSION TEXT */
.message {
    font-family: 'Playfair Display', serif;
    color: #e9dce5;
    font-size: 17px;
    line-height: 1.9;
    text-align: center;
    max-width: 420px;
    margin: 25px auto;
    white-space: pre-line;
    overflow-wrap: break-word;
}

/* BUTTONS */
button {
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: .3s ease;
}

.primary {
    background: linear-gradient(110deg,#d65d91,#a64d8b);
    color: white;
    border: none;
    padding: 15px 32px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(214,93,145,.25);
}

.primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px rgba(214,93,145,.45);
}

.question {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    line-height: 1.5;
    margin: 30px 0 25px;
}

.choices {
    display: flex;
    flex-direction: column;
    gap: 13px;
    max-width: 290px;
    margin: auto;
}

.yes {
    background: #d65d91;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 30px;
    font-size: 14px;
}

.time {
    background: transparent;
    border: 1px solid rgba(255,255,255,.2);
    color: #d8cbd5;
    padding: 15px;
    border-radius: 30px;
    font-size: 14px;
}

.yes:hover, .time:hover {
    transform: translateY(-3px);
}

/* RESPONSE PAGE */
.response-title {
    font-family: 'Playfair Display', serif;
    color: #f0a2c1;
    font-size: 30px;
    margin: 20px 0;
}

.response-text {
    color: #c9bdc9;
    font-size: 15px;
    line-height: 1.9;
}

/* FINAL PAGE */
.final-text {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    color: #e9dce5;
    line-height: 1.9;
    margin: 30px auto;
}

.final-text span {
    color: #f0a2c1;
    font-style: italic;
    font-size: 26px;
}

.final-tag {
    color: #d58eae;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 25px;
}

/* FOOTER */
.footer {
    margin-top: 40px;
    font-size: 10px;
    color: #746a78;
    letter-spacing: 2px;
}

/* FLOATING PARTICLES */
.particle {
    position: fixed;
    bottom: -30px;
    color: #e98bb2;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: float 9s linear forwards;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: .5; }
    85% { opacity: .4; }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

/* MOBILE */
@media(max-width:480px) {
    .container {
        padding: 40px 21px;
    }

    .message {
        font-size: 16px;
        line-height: 1.85;
    }

    .question {
        font-size: 21px;
    }

    .final-text {
        font-size: 19px;
    }
}

</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <div class="tag">A little something special</div>

    <!-- PAGE 1: OPENING -->
    <section class="page active" id="page1">

        <div class="heart">♡</div>

        <h1>Hey, <span>Gunnu.</span></h1>

        <p class="subtitle">
            There's something I've been wanting to tell you...
        </p>

        <button class="primary" onclick="nextPage(2)">
            Open this little surprise ✨
        </button>

    </section>


    <!-- PAGE 2: CONFESSION -->
    <section class="page" id="page2">

        <div class="heart">♡</div>

        <h1>Just for <span>You.</span></h1>

        <div class="message" id="typed"></div>

        <p class="question">
            So... would you give us a chance? ♡
        </p>

        <div class="choices">

            <button class="yes" onclick="answer('yes')">
                Yes, I feel the same ❤️
            </button>

            <button class="time" onclick="answer('time')">
                I need some time 🌷
            </button>

        </div>

    </section>


    <!-- PAGE 3: HER RESPONSE -->
    <section class="page" id="page3">

        <div class="heart">♡</div>

        <h2 class="response-title" id="responseTitle"></h2>

        <p class="response-text" id="responseText"></p>

    </section>


    <!-- PAGE 4: FINAL PRANK REVEAL -->
    <section class="page" id="page4">

        <div class="heart">♡</div>

        <h1>One last <span>thing...</span></h1>

        <div class="final-text">
            Don't take it seriously... 😂

            <br><br>

            <span>I was just joking!</span>

            <br><br>

            Or was I? 👀❤️
        </div>

        <p class="final-tag">
            JUST KIDDING... MAYBE ♡
        </p>

    </section>


    <div class="footer">
        MADE WITH A LITTLE COURAGE ♡
    </div>

</div>


<script>

// CONFESSION MESSAGE
const confession = `Hey Gunnu,

I don't really know how to put this into perfect words, but I wanted to be honest with you.

Somehow, you've become someone special to me. Your presence makes ordinary moments feel a little more beautiful.

I don't want to make any promises I cannot keep. I just want you to know that I genuinely like you, and I'd love to get to know you even better.

No pressure. Just something my heart wanted you to know. ❤️`;


// PAGE NAVIGATION
function nextPage(pageNumber) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    const next = document.getElementById("page" + pageNumber);

    next.classList.remove("active");

    // Restart entrance animation
    void next.offsetWidth;

    next.classList.add("active");

}


// TYPEWRITER EFFECT
let typingStarted = false;

function startTyping() {

    if (typingStarted) return;

    typingStarted = true;

    const text = document.getElementById("typed");

    let i = 0;

    function type() {

        if (i < confession.length) {

            text.textContent += confession.charAt(i);

            i++;

            setTimeout(type, 28);

        }

    }

    type();

}


// OPEN CONFESSION PAGE
document.querySelector("#page1 button").addEventListener("click", () => {

    nextPage(2);

    startTyping();

});


// ANSWER HANDLER
function answer(choice) {

    const title = document.getElementById("responseTitle");

    const text = document.getElementById("responseText");

    if (choice === "yes") {

        title.textContent = "You made my day! ❤️";

        text.textContent =
        "Thank you, Gunnu! Here's to a beautiful new beginning. ✨";

        celebrate();

    } else {

        title.textContent = "That's completely okay. 🌷";

        text.textContent =
        "Take all the time you need, Gunnu. Your feelings matter.";

    }

    // SHOW RESPONSE PAGE
    nextPage(3);

    // AUTOMATICALLY SHOW FINAL PAGE
    setTimeout(() => {

        nextPage(4);

    }, 3000);

}


// HEART CELEBRATION
function celebrate() {

    for (let i = 0; i < 35; i++) {

        setTimeout(() => {

            const heart = document.createElement("div");

            heart.textContent =
            ["♡", "♥", "✧", "💕"][
                Math.floor(Math.random() * 4)
            ];

            heart.style.position = "fixed";

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.top = "-30px";

            heart.style.color = "#f18ab6";

            heart.style.fontSize =
            (15 + Math.random() * 20) + "px";

            heart.style.zIndex = "10";

            heart.style.pointerEvents = "none";

            document.body.appendChild(heart);

            heart.animate(
                [
                    {
                        transform: "translateY(0) rotate(0deg)",
                        opacity: 1
                    },
                    {
                        transform: "translateY(100vh) rotate(360deg)",
                        opacity: 0
                    }
                ],
                {
                    duration: 3500 + Math.random() * 2000
                }
            ).onfinish = () => heart.remove();

        }, i * 100);

    }

}


// BACKGROUND PARTICLES
setInterval(() => {

    const p = document.createElement("div");

    p.className = "particle";

    p.textContent = Math.random() > .5 ? "♡" : "✧";

    p.style.left = Math.random() * 100 + "vw";

    p.style.fontSize =
    (12 + Math.random() * 18) + "px";

    p.style.animationDuration =
    (7 + Math.random() * 7) + "s";

    document.body.appendChild(p);

    setTimeout(() => p.remove(), 15000);

}, 800);

</script>

</body>
</html>
